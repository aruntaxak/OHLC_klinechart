<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHLC Viewer (KLineChart)</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: #131722; }
        #app { display: flex; flex-direction: row; height: 100vh; }
        #main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
        #topbar {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            padding: 8px 12px; background: #fafafa; border-bottom: 1px solid #e3e3e3;
        }
        #symbol { color: #26a69a; font-weight: bold; margin-right: 4px; }
        button, input[type="date"], select {
            background: #ffffff; color: #131722; border: 1px solid #cfcfcf;
            border-radius: 4px; padding: 5px 10px; font-size: 13px; cursor: pointer;
        }
        button:hover { background: #f0f0f0; }
        button.active { background: #26a69a; color: #ffffff; border-color: #26a69a; }
        .divider { width: 1px; height: 22px; background: #ddd; margin: 0 4px; }
        .ind-wrap { position: relative; }
        #indMenu, #drawMenu {
            position: absolute; top: 100%; left: 0; z-index: 30; margin-top: 4px;
            background: #ffffff; border: 1px solid #cfcfcf; border-radius: 6px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12); padding: 6px; min-width: 200px;
            max-height: 70vh; overflow: auto;
        }
        .hidden { display: none; }
        .menu-title { padding: 4px 6px; font-size: 11px; color: #888; text-transform: uppercase; }
        .ind-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
        .ind-row:hover { background: #f4f4f4; }
        .ind-row label { cursor: pointer; flex: 1 1 auto; }
        .ind-row input { cursor: pointer; }
        #views { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: row; }
        #views.split { flex-direction: row; }
        .chart-view { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column;
                      border: 2px solid transparent; position: relative; }
        .chart-view.active-view { border-color: #26a69a; }
        .chart-view + .chart-view { border-left: 1px solid #e3e3e3; }
        .cv-chart { flex: 1 1 auto; min-height: 0; width: 100%; }
        #status { padding: 6px 12px; font-size: 12px; color: #6b6b6b; background: #fafafa; border-top: 1px solid #e3e3e3; }

        /* Per-view indicator legend (top-right of each chart, kept clear of the
           price-axis labels so the gear/eye sit inside the plot area) */
        .cv-legend { position: absolute; top: 4px; right: 64px; z-index: 10;
                     display: flex; flex-direction: column; align-items: flex-end;
                     gap: 2px; pointer-events: none; font-size: 12px; }
        .ind-item { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.88);
                    border: 1px solid #e3e3e3; border-radius: 4px; padding: 1px 5px;
                    pointer-events: none; }
        .ind-item.ind-hidden { opacity: 0.5; }
        .ind-name { font-weight: bold; }
        .ind-val { font-variant-numeric: tabular-nums; }
        .ind-gear, .ind-eye { pointer-events: auto; background: transparent; border: none; color: #6b6b6b;
                    cursor: pointer; padding: 1px; display: inline-flex; align-items: center; }
        .ind-gear:hover, .ind-eye:hover { color: #26a69a; }

        /* Floating indicator / overlay settings box */
        #indSettings, #overlaySettings { position: fixed; top: 52px; right: 12px; z-index: 60; width: 240px;
                       background: #ffffff; border: 1px solid #cfcfcf; border-radius: 8px;
                       box-shadow: 0 6px 22px rgba(0,0,0,0.16); max-height: 85vh; overflow-y: auto; }
        #indSettings .is-head, #overlaySettings .os-head { display: flex; align-items: center; justify-content: space-between;
                                padding: 8px 10px; font-weight: bold; font-size: 13px;
                                background: #fafafa; border-bottom: 1px solid #e3e3e3; }
        #indSettings .is-close, #overlaySettings .os-close { background: transparent; border: none; font-size: 18px;
                                 line-height: 1; cursor: pointer; color: #888; padding: 0 4px; }
        #indSettings .is-close:hover, #overlaySettings .os-close:hover { color: #131722; }
        #indSettings .is-body, #overlaySettings .os-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
        #indSettings .is-none, #overlaySettings .os-none { font-size: 12px; color: #888; }
        #indSettings .is-row, #overlaySettings .os-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        #indSettings .is-row label, #overlaySettings .os-row label { font-size: 12px; color: #333; }
        #indSettings .is-row input, #overlaySettings .os-row input,
        #indSettings .is-row select, #overlaySettings .os-row select { width: 84px; padding: 4px 6px; border: 1px solid #cfcfcf;
                                     border-radius: 4px; font-size: 13px; }
        #indSettings .is-color { width: 40px; height: 26px; padding: 1px; cursor: pointer; }
        .draw-color-row { cursor: default; justify-content: space-between; }
        .draw-color-row .draw-color { width: 40px; height: 26px; padding: 1px; cursor: pointer;
                                       border: 1px solid #cfcfcf; border-radius: 4px; }

        /* Watchlist sidebar */
        #sidebar {
            width: 170px; flex: 0 0 170px; display: flex; flex-direction: column;
            background: #fafafa; border-right: 1px solid #e3e3e3; border-left: none;
            overflow: hidden; transition: flex-basis .15s ease, width .15s ease;
        }
        #app.collapsed #sidebar { flex-basis: 0 !important; width: 0 !important; border-right: none; }
        #sbResize { flex: 0 0 1px; width: 1px; cursor: col-resize; background: transparent; }
        #sbResize:hover { background: #26a69a; }
        #app.collapsed #sbResize { display: none; }
        #sbSearch { margin: 8px; padding: 5px 8px; font-size: 12px; border: 1px solid #cfcfcf;
                    border-radius: 4px; width: calc(100% - 16px); }
        #watchlists { flex: 1 1 auto; overflow-y: auto; padding: 2px 0 14px; }
        .wl { border-bottom: 1px solid #eee; }
        .wl-head { display: flex; align-items: center; gap: 6px; padding: 7px 10px;
                   cursor: pointer; user-select: none; }
        .wl-head:hover { background: #f0f0f0; }
        .wl-chev { width: 12px; font-size: 10px; color: #888; transition: transform .12s; }
        .wl.open .wl-chev { transform: rotate(90deg); }
        .wl-name { flex: 1 1 auto; font-weight: 600; font-size: 13px; }
        .wl-count { font-size: 11px; color: #999; background: #ececec; border-radius: 10px;
                    padding: 1px 7px; }
        .wl-items { list-style: none; margin: 0; padding: 0 0 4px; display: none; }
        .wl.open .wl-items { display: block; }
        .wl-item { padding: 5px 10px 5px 28px; font-size: 12.5px; color: #2a2e39; cursor: pointer;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .wl-item:hover { background: #eef6f5; color: #1c7a70; }
        .wl-item.sel { background: #26a69a; color: #fff; }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <input id="sbSearch" type="text" placeholder="Filter tickers…" />
            <div id="watchlists"></div>
        </div>
        <div id="sbResize" title="Drag to resize"></div>
        <div id="main">
        <div id="topbar">
            <button id="sbToggle" title="Toggle watchlist (&#9776;)">&#9776;</button>
            <select id="tfSelect" title="Timeframe"></select>
            <button id="zoomOutBtn" title="Zoom out (−)">−</button>
            <button id="zoomInBtn" title="Zoom in (+)">+</button>
            <button id="resetBtn" title="Reset zoom (0)">Reset</button>
            <button id="latestBtn" title="Jump to the most recent trading day">Latest</button>
            <span class="ind-wrap">
                <button id="indBtn" title="Indicators (i)">Indicators ▾</button>
                <div id="indMenu" class="hidden"></div>
            </span>
            <span class="ind-wrap">
                <button id="drawBtn" title="Drawing tools">Draw ▾</button>
                <div id="drawMenu" class="hidden"></div>
            </span>
            <span class="divider"></span>
            <button id="splitBtn" title="Split screen: compare two timeframes">▣ Split</button>
            <button id="linkBtn" title="Link panes: keep both centres aligned in time while panning">Link</button>
            <span class="divider"></span>
            <button id="prevBtn" title="Previous trading day (←)">‹ Prev</button>
            <input type="date" id="dateInput" />
            <button id="nextBtn" title="Next trading day (→)">Next ›</button>
        </div>

        <div id="views"></div>

        <div id="status"></div>
        </div>
    </div>

    <div id="indSettings" class="hidden"></div>
    <div id="overlaySettings" class="hidden"></div>

    <div id="err" style="display:none; position:fixed; inset:0; background:rgba(18,18,28,.96); color:#ffb4b4; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; padding:24px; overflow:auto; z-index:9999; white-space:pre-wrap;"></div>
    <script>
    (function () {
        function show(m) {
            var e = document.getElementById('err');
            if (e) { e.style.display = 'block'; e.textContent += m + "\n\n"; }
            console.error(m);
        }
        window.addEventListener('error', function (ev) {
            show('[error] ' + (ev.message || (ev.error && ev.error.stack) || ev.error) +
                  (ev.filename ? ('\n  at ' + ev.filename + ':' + ev.lineno) : ''));
        });
        window.addEventListener('unhandledrejection', function (ev) {
            var r = ev.reason;
            show('[unhandledrejection] ' + (r && (r.stack || r.message) || r));
        });
    })();
    </script>
    <script src="klinecharts.min.js"></script>
    <!-- Indicator plugins: each file self-registers with KLineChart and pushes an
         entry onto window.INDICATORS. Adding an indicator = drop a file here.
         Must load after klinecharts.min.js and before app.js. -->
    <script src="indicators/util.js"></script>
    <script src="indicators/atr.js"></script>
    <script src="indicators/kalman.js"></script>
    <script src="indicators/harmonic.js"></script>
    <script src="indicators/insidebar.js"></script>
    <script src="indicators/hhll.js"></script>
    <script src="indicators/divergence.js"></script>
    <script src="app.js"></script>
</body>
</html>
